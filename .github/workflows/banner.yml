name: Refresh banner stats

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - .github/scripts/gen-banner.mjs
      - .github/workflows/banner.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/scripts/gen-banner.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/banner.svg docs/stats.json; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg docs/stats.json
          git commit -m "chore: refresh banner stats [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push $i failed, rebasing"; git pull --rebase --autostash origin main || true
          done
          exit 1
